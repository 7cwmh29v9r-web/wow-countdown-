<script>
  // WoW Forever Races & Specific Class Limits
  const raceClasses = {
    "Human": ["Warrior", "Paladin", "Rogue", "Priest", "Mage", "Warlock", "Hunter"],
    "Dwarf": ["Warrior", "Paladin", "Hunter", "Rogue", "Priest", "Shaman"],
    "Night Elf": ["Warrior", "Hunter", "Rogue", "Priest", "Druid"],
    "Gnome": ["Warrior", "Rogue", "Mage", "Warlock", "Priest"],
    "Orc": ["Warrior", "Hunter", "Rogue", "Shaman", "Warlock", "Mage"],
    "Undead": ["Warrior", "Rogue", "Priest", "Mage", "Warlock", "Paladin"],
    "Tauren": ["Warrior", "Hunter", "Shaman", "Druid"],
    "Troll": ["Warrior", "Hunter", "Rogue", "Shaman", "Mage", "Priest", "Warlock"],
    "Skyborne": ["Warrior", "Hunter", "Rogue", "Druid", "Mage", "Shaman"]
  };

  const players = ["Martin", "David", "Jarda"];
  const weekends = ["7. - 8. Listopadu 2026", "14. - 15. Listopadu 2026", "21. - 22. Listopadu 2026", "28. - 29. Listopadu 2026"];

  let appState = { players: {}, schedule: {} };

  // Initialize Default State
  players.forEach(p => {
    appState.players[p] = {
      main: { race: "Human", class: "Paladin" },
      alt: { race: "Orc", class: "Warrior" }
    };
  });
  weekends.forEach((w, idx) => {
    appState.schedule[idx] = { Martin: false, David: false, Jarda: false };
  });

  // Countdown Logic
  const targetDate = new Date("2026-11-05T00:00:00").getTime();
  function updateCountdown() {
    const now = new Date().getTime();
    const diff = targetDate - now;
    if (diff > 0) {
      document.getElementById("dny").innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
      document.getElementById("hodiny").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
      document.getElementById("minuty").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
      document.getElementById("sekundy").innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
    }
  }
  setInterval(updateCountdown, 1000);
  updateCountdown();

  // Render Players UI
  function renderPlayers() {
    const container = document.getElementById("playersContainer");
    container.innerHTML = "";

    players.forEach(p => {
      const card = document.createElement("div");
      card.className = "player-card card";
      card.innerHTML = `<div class="player-name">${p}</div>`;

      ["main", "alt"].forEach(type => {
        const charData = appState.players[p][type];
        const charBox = document.createElement("div");
        charBox.className = "character-box";
        
        let raceOptions = Object.keys(raceClasses).map(r => `<option value="${r}" ${r === charData.race ? 'selected' : ''}>${r}</option>`).join('');
        let availableClasses = raceClasses[charData.race] || [];
        let classOptions = availableClasses.map(c => `<option value="${c}" ${c === charData.class ? 'selected' : ''}>${c}</option>`).join('');

        charBox.innerHTML = `
          <div class="char-header">${type.toUpperCase()} Postava</div>
          <div class="select-group">
            <label>Rasa:</label>
            <select onchange="updateRace('${p}', '${type}', this.value)">${raceOptions}</select>
          </div>
          <div class="select-group">
            <label>Povolání (Class):</label>
            <select onchange="updateClass('${p}', '${type}', this.value)">${classOptions}</select>
          </div>
        `;
        card.appendChild(charBox);
      });

      container.appendChild(card);
    });
  }

  function updateRace(player, type, race) {
    appState.players[player][type].race = race;
    const validClasses = raceClasses[race];
    if (!validClasses.includes(appState.players[player][type].class)) {
      appState.players[player][type].class = validClasses[0];
    }
    updateUrlHash();
    renderPlayers();
  }

  function updateClass(player, type, cls) {
    appState.players[player][type].class = cls;
    updateUrlHash();
  }

  // Render Schedule UI
  function renderSchedule() {
    const tbody = document.getElementById("scheduleBody");
    tbody.innerHTML = "";

    weekends.forEach((w, idx) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${w}</td>` + players.map(p => `
        <td>
          <input type="checkbox" class="checkbox-custom" 
            ${appState.schedule[idx] && appState.schedule[idx][p] ? 'checked' : ''} 
            onchange="toggleSchedule(${idx}, '${p}', this.checked)">
        </td>
      `).join('');
      tbody.appendChild(tr);
    });
  }

  function toggleSchedule(wIdx, player, checked) {
    if (!appState.schedule[wIdx]) appState.schedule[wIdx] = {};
    appState.schedule[wIdx][player] = checked;
    updateUrlHash();
  }

  // Synchronizace stavu do URL Hash
  function updateUrlHash() {
    const jsonStr = JSON.stringify(appState);
    const encoded = btoa(encodeURIComponent(jsonStr));
    window.location.hash = "state=" + encoded;
  }

  // URL Hash State Management
  function copyShareUrl() {
    updateUrlHash(); // Ujistíme se, že URL obsahuje nejaktuálnější stav
    const currentUrl = window.location.href;
    
    navigator.clipboard.writeText(currentUrl).then(() => {
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2500);
    });
  }

  function loadStateFromUrl() {
    if (window.location.hash.includes("state=")) {
      try {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const encoded = hashParams.get("state");
        if (encoded) {
          const jsonStr = decodeURIComponent(atob(encoded));
          const loaded = JSON.parse(jsonStr);
          if (loaded.players && loaded.schedule) {
            appState = loaded;
          }
        }
      } catch (e) {
        console.error("Chyba při načítání stavu z URL", e);
      }
    }
  }

  function downloadICS() {
    const icsData = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:World of Warcraft: Forever Launch\nDESCRIPTION:Spuštění hry WoW Forever!\nDTSTART:20261104T230000Z\nDTEND:20261105T040000Z\nEND:VEVENT\nEND:VCALENDAR`;
    const blob = new Blob([icsData], { type: 'text/calendar' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'wow-forever-launch.ics';
    a.click();
  }

  // Init - Pořadí je klíčové!
  loadStateFromUrl();
  renderPlayers();
  renderSchedule();
</script>
